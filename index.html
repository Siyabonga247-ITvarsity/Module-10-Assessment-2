<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --brand-1: #6d5df6;
            --brand-2: #a44cf0;
            --ink: #1e1b2e;
            --muted: #7a7590;
            --card: #ffffff;
            --bg: #f4f2fb;
        }

        * { -webkit-tap-highlight-color: transparent; }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(1200px 500px at 100% -10%, rgba(164, 76, 240, .18), transparent 60%),
                radial-gradient(900px 400px at -10% 110%, rgba(109, 93, 246, .18), transparent 60%),
                var(--bg);
            color: var(--ink);
            padding: 24px 16px 64px;
        }

        .app-shell {
            max-width: 560px;
            margin: 0 auto;
        }

        /* ---------- Header ---------- */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        .app-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-logo .logo-badge {
            width: 46px; height: 46px;
            border-radius: 14px;
            display: grid; place-items: center;
            color: #fff; font-size: 1.3rem;
            background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
            box-shadow: 0 8px 20px rgba(109, 93, 246, .35);
        }

        .app-logo h1 {
            font-size: 1.35rem; font-weight: 800; margin: 0;
            letter-spacing: -.02em;
        }

        .app-logo small {
            display: block;
            color: var(--muted);
            font-weight: 500;
            font-size: .8rem;
        }

        .btn-grad {
            border: none;
            color: #fff;
            font-weight: 600;
            background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
            box-shadow: 0 6px 16px rgba(109, 93, 246, .35);
            border-radius: 12px;
            padding: .55rem 1.1rem;
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .btn-grad:hover { color:#fff; transform: translateY(-2px); box-shadow: 0 10px 22px rgba(109,93,246,.45); }

        .btn-ghost {
            background: #fff;
            border: 1px solid #e6e2f4;
            color: var(--ink);
            font-weight: 600;
            border-radius: 12px;
            padding: .55rem 1.1rem;
            transition: transform .15s ease, background .15s ease;
        }
        .btn-ghost:hover { background: #faf9ff; transform: translateY(-2px); }

        .btn-danger-soft {
            background: #fff0f0;
            border: 1px solid #ffd6d6;
            color: #d33;
            font-weight: 600;
            border-radius: 12px;
            padding: .55rem 1.1rem;
        }
        .btn-danger-soft:hover { background: #ffe3e3; color:#d33; }

        /* ---------- Contact list ---------- */
        .contact-list { display: flex; flex-direction: column; gap: 12px; }

        .contact-card {
            display: flex; align-items: center; gap: 14px;
            background: var(--card);
            border: 1px solid #ece8f8;
            border-radius: 18px;
            padding: 14px 16px;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(30, 27, 46, .05);
            transition: transform .15s ease, box-shadow .15s ease;
            animation: pop .35s ease both;
        }
        .contact-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 26px rgba(109, 93, 246, .18);
        }

        @keyframes pop {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 54px; height: 54px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 3px solid #efeaff;
            background: #efeaff;
        }

        .avatar-initials {
            width: 54px; height: 54px;
            border-radius: 50%;
            flex-shrink: 0;
            display: none;
            align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: 1.05rem;
            background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
            border: 3px solid #efeaff;
        }

        .contact-info { flex: 1; min-width: 0; }
        .contact-name {
            font-weight: 700; font-size: 1.02rem; margin: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .contact-sub {
            color: var(--muted); font-size: .85rem; margin: 2px 0 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .contact-arrow { color: #c9c3e0; font-size: 1.1rem; }

        .empty-state, .loading-state {
            text-align: center;
            color: var(--muted);
            padding: 60px 20px;
            background: var(--card);
            border: 1px dashed #d9d3ee;
            border-radius: 18px;
        }
        .empty-state i, .loading-state i { font-size: 2.4rem; display:block; margin-bottom: 12px; color: #b7aee0; }

        .spin { animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Forms ---------- */
        .panel {
            background: var(--card);
            border: 1px solid #ece8f8;
            border-radius: 22px;
            padding: 26px 24px;
            box-shadow: 0 10px 30px rgba(30, 27, 46, .08);
        }

        .form-label { font-weight: 600; font-size: .9rem; }
        .form-control {
            border-radius: 12px;
            border: 1.5px solid #e6e2f4;
            padding: .65rem .9rem;
        }
        .form-control:focus {
            border-color: var(--brand-1);
            box-shadow: 0 0 0 .2rem rgba(109, 93, 246, .15);
        }
        .form-control[readonly] { background: #faf9ff; }

        .page-title { font-weight: 800; letter-spacing: -.02em; }
        .back-link {
            color: var(--muted); text-decoration: none; font-weight: 600;
            display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px;
        }
        .back-link:hover { color: var(--brand-1); }

        .big-avatar-wrap { position: relative; width: 128px; margin: 0 auto 20px; }
        .big-avatar, .big-avatar-initials {
            width: 128px; height: 128px; border-radius: 50%; object-fit: cover;
            border: 5px solid #efeaff;
            background: #efeaff;
            box-shadow: 0 10px 26px rgba(109, 93, 246, .25);
        }
        .big-avatar-initials {
            display: none; place-items: center;
            color: #fff; font-size: 2.6rem; font-weight: 800;
            background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
        }

        .avatar-preview, .avatar-preview-initials {
            width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
            border: 4px solid #efeaff; background:#efeaff; display:none; margin-bottom: 16px;
        }
        .avatar-preview-initials { display:none; place-items:center; color:#fff; font-weight:700; font-size:1.8rem;
            background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); }

        /* ---------- API key page ---------- */
        .key-card {
            max-width: 420px; margin: 8vh auto 0;
            text-align: center;
        }
        .key-icon {
            width: 64px; height: 64px; margin: 0 auto 16px;
            border-radius: 20px; display: grid; place-items: center;
            font-size: 1.7rem; color: #fff;
            background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
            box-shadow: 0 10px 24px rgba(109, 93, 246, .4);
        }
    </style>

</head>
<body onload="fetchContacts()">

    <div class="app-shell">

        <header class="app-header">
            <div class="app-logo">
                <div class="logo-badge"><i class="bi bi-person-rolodex"></i></div>
                <div>
                    <h1>ContactBook</h1>
                    <small id="contactCount">Loading contacts…</small>
                </div>
            </div>
            <button id="addContact" class="btn btn-grad"><i class="bi bi-plus-lg"></i> Add</button>
        </header>

        <div class="mb-3" id="searchWrap" style="display:none;">
            <div class="input-group">
                <span class="input-group-text" style="border-radius:12px 0 0 12px; border:1.5px solid #e6e2f4; border-right:none; background:#fff;"><i class="bi bi-search" style="color:#a49dc4;"></i></span>
                <input type="text" id="searchBox" class="form-control" placeholder="Search contacts…" style="border-left:none;">
            </div>
        </div>

        <div id="table">
            <div class="loading-state">
                <i class="bi bi-arrow-repeat spin"></i>
                Contact loading...
            </div>
        </div>

    </div>

    <script src="config.js"></script>

    <script>
        var allContacts = [];

        document.getElementById("addContact").addEventListener('click', addContact);
        document.getElementById("searchBox").addEventListener('input', filterContacts);

        function fetchContacts() {
            document.getElementById("table").innerHTML =
                '<div class="loading-state"><i class="bi bi-arrow-repeat spin"></i>Contact loading...</div>';
            document.getElementById("contactCount").textContent = "Loading contacts…";

            fetch(rootPath + "controller/get-contacts/?apiKey=" + apiKey)
                .then(function(response) {
                    if (!response.ok) { throw new Error("Network response was not OK"); }
                    return response.json();
                })
                .then(function(data) {
                    console.log(data);
                    allContacts = data;
                    displayOutput(data);
                })
                .catch(function(error) {
                    console.error(error);
                    document.getElementById("table").innerHTML =
                        '<div class="empty-state"><i class="bi bi-wifi-off"></i>Error loading contacts.</div>';
                });
        }

        function displayOutput(data) {
            document.getElementById("contactCount").textContent =
                data.length + (data.length === 1 ? " contact" : " contacts");
            document.getElementById("searchWrap").style.display = data.length ? "block" : "none";

            if (!data.length) {
                document.getElementById("table").innerHTML =
                    '<div class="empty-state"><i class="bi bi-person-plus"></i>No contacts yet.<br>Tap <b>Add</b> to create your first one!</div>';
                return;
            }

            let output = '<div class="contact-list">';
            for (let i = 0; i < data.length; i++) {
                let contact = data[i];
                let initials = (contact.firstname[0] + (contact.lastname ? contact.lastname[0] : "")).toUpperCase();
                let sub = [contact.mobile, contact.email].filter(Boolean).join(" · ");
                output += `
                    <div class="contact-card" style="animation-delay:${i * 0.04}s" onclick="editContact(${contact.id})">
                        <img class="avatar" src="${rootPath}controller/uploads/${contact.avatar}" alt=""
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                        <div class="avatar-initials">${initials}</div>
                        <div class="contact-info">
                            <p class="contact-name">${contact.firstname} ${contact.lastname}</p>
                            <p class="contact-sub">${sub}</p>
                        </div>
                        <i class="bi bi-chevron-right contact-arrow"></i>
                    </div>
                `;
            }
            output += "</div>";
            document.getElementById("table").innerHTML = output;
        }

        function filterContacts(e) {
            let q = e.target.value.toLowerCase();
            let filtered = allContacts.filter(function(c) {
                return (c.firstname + " " + c.lastname + " " + (c.mobile || "") + " " + (c.email || "")).toLowerCase().includes(q);
            });
            // keep the count label stable while searching
            let countEl = document.getElementById("contactCount");
            displayOutput(filtered);
            countEl.textContent = allContacts.length + (allContacts.length === 1 ? " contact" : " contacts");
        }

        function addContact(){
            window.open("add-contact.html", "_self");
        }

        function editContact(id){
            window.open("edit-contact.html?id=" + id, "_self");
        }
    </script>

</body>
</html>
